version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logiCore-rag-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ENABLE_RAG=${ENABLE_RAG:-true}
      - MONGODB_URI=${MONGODB_URI:-mongodb://admin:password@mongodb:27017/logiCore_rag?authSource=admin}
      - RAG_LLM_API_KEY=${RAG_LLM_API_KEY}
      - RAG_LLM_PROVIDER=${RAG_LLM_PROVIDER:-openai}
      - RAG_LLM_MODEL=${RAG_LLM_MODEL:-gpt-4-turbo}
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-text-embedding-3-small}
      - RAG_VECTOR_DB_TYPE=qdrant
      - RAG_VECTOR_DB_URL=http://qdrant:6333
      - RAG_VECTOR_INDEX_NAME=${RAG_VECTOR_INDEX_NAME:-logiCore_embeddings}
      - RAG_VECTOR_DIMENSIONS=${RAG_VECTOR_DIMENSIONS:-1536}
      - RAG_REDIS_URL=redis://redis:6379
      - RAG_CACHE_TTL_SECONDS=${RAG_CACHE_TTL_SECONDS:-300}
      - RAG_ASSEMBLYAI_API_KEY=${RAG_ASSEMBLYAI_API_KEY:-}
      - RAG_TESSERACT_LANG=${RAG_TESSERACT_LANG:-ara+eng}
      - RAG_CROSS_ENCODER_MODEL=${RAG_CROSS_ENCODER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      - JWT_SECRET=${JWT_SECRET}
      - REPORTS_DIR=/app/reports
      - UPLOADS_DIR=/app/uploads/incidents
    volumes:
      - ./reports:/app/reports
      - ./uploads:/app/uploads
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: logiCore-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: logiCore-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: logiCore-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-password}
      - MONGO_INITDB_DATABASE=logiCore_rag
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  qdrant_storage:
  redis_data:
  mongo_data:
